services:
  - type: web
    name: smartfeed-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
    disk:
      name: smartfeed-storage
      mountPath: /app/data
      sizeGB: 1
